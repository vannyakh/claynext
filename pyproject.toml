[project]
name = "claynext"
version = "0.1.0"
description = "Claynext Studio — AI movie dubbing & timeline editor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av==14.1.0",
    "deep-translator>=1.11.4",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "imageio-ffmpeg>=0.6.0",
    "kittentts",
    "moviepy>=2.2.1",
    "onnxruntime==1.19.2",
    "pyside6>=6.11.2",
    "qt-pyqt-pyside-custom-widgets",
    "sentencepiece>=0.2.2",
    "transformers>=4.57.6",
    "typesafe-sdk>=0.7.5",
]

[project.optional-dependencies]
whisperx = [
    "whisperx>=3.3.0",
    "torch==2.8.0",
    "torchaudio>=2.4.0",
]
demucs = [
    "demucs>=4.0.1",
    "torch==2.8.0",
    "torchaudio>=2.4.0",
]
demucs-mlx = [
    "demucs-mlx>=1.4.0",
]
voxcpm = [
    "voxcpm>=2.0.3",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "soundfile>=0.12.0",
]
omnivoice = [
    "omnivoice>=0.2.1",
    "torch>=2.4",
    "torchaudio>=2.4",
    "soundfile>=0.12.0",
]
gender = [
    "torch==2.8.0",
    "torchaudio>=2.4.0",
]

[project.scripts]
claynext = "claynext.cli:main"
claynext-dub-plan = "claynext.models.dubbing_plan:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claynext"]

[tool.hatch.build.targets.wheel.force-include]
"src/claynext/models/models.json" = "claynext/models/models.json"

[tool.uv.sources]
kittentts = { git = "https://github.com/vannyakh/KittenTTS.git" }
