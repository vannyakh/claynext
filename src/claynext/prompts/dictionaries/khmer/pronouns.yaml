# English vocatives that hint at a relationship. Heuristic evidence only:
# a hint never outranks an editor or project relationship and is reviewed.
vocative_cues:
  - pattern: "\\b(mom|mommy|mum|mother|mama)\\b"
    relation: child_to_parent
    listener_gender: female
  - pattern: "\\b(dad|daddy|father|papa)\\b"
    relation: child_to_parent
    listener_gender: male
  - pattern: "\\b(grandma|granny|grandmother)\\b"
    relation: grandchild_to_grandparent
    listener_gender: female
  - pattern: "\\b(grandpa|grandfather)\\b"
    relation: grandchild_to_grandparent
    listener_gender: male
  - pattern: "\\b(honey|darling|sweetheart|babe)\\b"
    relation: romantic
  - pattern: "\\b(bro|dude)\\b"
    relation: friends_close
  - pattern: "\\b(boss)\\b"
    relation: employee_to_boss
  - pattern: "\\b(venerable)\\b"
    relation: lay_to_monk
  - pattern: "\\byour (majesty|highness)\\b"
    relation: subject_to_royalty
  - pattern: "\\b(officer)\\b"
    relation: civilian_to_police
  - pattern: "\\b(uncle)\\b"
    relation: younger_to_elder
    listener_gender: male
  - pattern: "\\b(auntie|aunty|aunt)\\b"
    relation: younger_to_elder
    listener_gender: female
