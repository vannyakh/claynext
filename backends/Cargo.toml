[workspace]
members = [
    "ffmpeg",
    "cpu",
    "wgpu",
    "ai-runtime",
    "hardware-codecs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Claynext Team"]
license = "MIT"
repository = "https://github.com/vannyakh/Claynext"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
